<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уйобище</title>
    <link rel="stylesheet" href="./CSS/styles.css">
</head>

<body class="container">
    <div class="time">
        14:43
    </div>
    <div class="day">неділя 31травня


    </div>
    <div class="picture">
        <img src="./Шаболда.jfif" alt="Уйобище">
        <p>Уйобище</p>

    </div>
    <footer class="footer">
        <ul class="under">
            <li class="item">Facebook</li>
            <p>Уйобище</p>
            <li class="item">Instagram</li>
            <li class="item">Telegram</li>
            <li class="item">Viber</li>
        </ul>


    </footer>
    <Div class="Zheka">Женя лох</Div>
    <Div class="Zheka">Женя лох</Div>
    <span>Женя лох</span>
    <span>Женя лох</span>
    <div class="work"></div>
    <ul class="contact">
        <li class="item-contact"> <a href="">help desk</a> </li>
        <li class="item-contact"> <a href="">Contact Us</a></li>
        <li class="item-contact"> <a href="">FAQ</a></li>
    </ul>
    <div class="box"></div>
    <button class="button">Нажми здесь</button>

    <form class=" form js-speaker-form">

        <div class="form-field">
            <label for="name" class="form-label"> Имя </label>
            <input class="form-input" type="text" id="name" name="name" autofocus placeholder="Иванов Иван">
        </div>

        <div class="form-field">
            <label for="tel"> Телефон </label>
            <input type="tel" id="tel" name="tel" placeholder="+380 (__) ___-__-__">
        </div>

        <div class="form-field">
            <label for="email"> Email </label>
            <input type="email" id="email" name="email" placeholder="123@gmail">>
        </div>

        <div role="group" class="group" aria-labelledby="skills">
            <h2 class="group-title">Тема доклада</h2>

            <ul class="skills-options">
                <li>
                    <input type="checkbox" id="html" value="html" name="skills">
                    <label for="html">html</label>
                </li>
                <li>
                    <input type="checkbox" id="css" value="css" name="skills">
                    <label for="css">css</label>
                </li>
                <li>
                    <input type="checkbox" id="js" value="js" name=skills">
                    <label for="js">js</label>
                </li>
            </ul>
        </div>


        <div role="group" aria-labelledby="experience" class="group">

            <h2 class="group-title">Уровень вашей экспертизы</h2>
            <ul class="experience-options">
                <li>
                    <input type="radio" id="Junior" value="jun" name="experience">
                    <label for="Junior">Junior</label>
                </li>
                <li>
                    <input type="radio" id="Middle" value="middle" name="experience">
                    <label for="Middle">Middle</label>
                </li>
                <li> <input type="radio" id="Senior" value="senior" name="experience">
                    <label for="Senior">Senior</label>
                </li>
            </ul>
        </div>

        <div class="form-field">
            <label for="datetime"> Дата и время </label>
            <input type="datetime-local" name="datetime" id="datetime" class="date">
        </div>

        <div class="form-field">
            <label for="file"> Загрузить PDF </label>
            <input type="file" name="pdf" id="file">
        </div>


        <div class="form-field ">
            <label for="coment"> Добавьте коментарий </label>
            <textarea name="coment" id="coment" rows="10" placeholder="Оставить комментарий" class=""></textarea>
        </div>

        <div class="form-field policy">
            <input type="checkbox" name="policy" id="policy">
            <label for="policy"> Я согласен с условиями </label>
        </div>

        <br />
        <button class="submit"> Отправить</button>
    </form>
    <script>
        (() => {
            document
                .querySelector('.js-speaker-form')
                .addEventListener('submit', (e) => {
                    e.preventDefault();

                    new FormData(e.currentTarget).forEach((value, name) => {
                        console.log(`${name}: ${value}`);
                        e.currentTarget.reset();
                    });
                });
        })();
    </script>
</body>

</html>
